<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Mission Zéro — test du module ville</title>
  <style>html,body{margin:0;height:100%;overflow:hidden;background:#0b0e14;font-family:system-ui,sans-serif}#game{position:fixed;inset:0;width:100%;height:100%;display:block}#hud{position:fixed;left:8px;top:8px;color:#fff;font:12px monospace;background:#0008;padding:4px 8px;white-space:pre}</style>
  <script type="importmap">
  { "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/", "@shared/": "/shared/" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <!--
    Page de test isolée du module ville (aucun autre module).
    Paramètres : cam=x,y,z  look=x,y,z  agl=1 (hauteurs au-dessus du relief)  time=heure  quality=low|medium|high  sample=1 (force paris.sample.json)
                 nobuildings=1 (ignore buildings.json)  shadows=0
    Souris : glisser = tourner, molette = avancer ; ZQSD/WASD = se déplacer, Maj = vite.
  -->
  <script type="module">
    import * as THREE from 'three';
    import { collision } from '/src/core/collision.js';
    import { heightAt, baseHeightAt, WATER_LEVEL, setHeightmap } from '@shared/terrain.js';
    import { CITY, CITIES } from '@shared/cities.js';
    import { LANDMARKS, LANDMARK_BY_ID } from '@shared/landmarks.js';
    import { BOUNDS } from '@shared/geo.js';
    import { createWorld } from '/src/world/index.js';

    const params = new URLSearchParams(location.search);
    const canvas = document.getElementById('game');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
    renderer.shadowMap.enabled = params.get('shadows') !== '0'; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.3, 9000);
    const num = (s, d) => (s ? s.split(',').map(Number) : d);
    const cp = num(params.get('cam'), [60, 40, 160]), lk = num(params.get('look'), [0, 5, 0]);
    camera.position.set(...cp); camera.lookAt(...lk);

    const listeners = {};
    const bus = { on(n, f) { (listeners[n] ||= []).push(f); }, emit(n, d) { (listeners[n] || []).forEach((f) => f(d)); } };
    const hour = parseFloat(params.get('time') || '14');
    const night = hour < 6.3 || hour > 20.3;
    const sky = night ? new THREE.Color(0x0a1020) : new THREE.Color(0xa9c9e8);
    scene.background = sky; scene.fog = new THREE.Fog(sky.getHex(), 300, night ? 2500 : 5200);
    scene.add(new THREE.HemisphereLight(night ? 0x26324d : 0xcfe2ff, night ? 0x0a0a0c : 0x6b6455, night ? 0.5 : 1.1));
    const sun = new THREE.DirectionalLight(night ? 0x8fa6d8 : 0xfff0d8, night ? 0.25 : 3.0);
    sun.castShadow = renderer.shadowMap.enabled; sun.shadow.mapSize.set(4096, 4096);
    const SH = 260; Object.assign(sun.shadow.camera, { left: -SH, right: SH, top: SH, bottom: -SH, near: 10, far: 1600 });
    sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.06;
    scene.add(sun, sun.target);

    // Chargement des données de la ville courante (?city=paris|toulouse), comme client/src/main.js.
    async function loadJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error(url + ' ' + r.status); return r.json(); }
    async function loadBin(url, T) { const r = await fetch(url); if (!r.ok) throw new Error(url + ' ' + r.status); return new T(await r.arrayBuffer()); }
    const tLoad = performance.now(), f = CITY.files;
    const get = async (fn) => { try { return await fn(); } catch { return null; } };
    let [data, buildings, pois, bmeta, bmetaBin, terrain] = await Promise.all([
      get(() => (params.get('sample') ? null : loadJSON(f.roads))),
      get(() => (params.get('nobuildings') || params.get('sample') || !f.buildings ? null : f.buildings.endsWith('.bin') ? loadBin(f.buildings, Float32Array) : loadJSON(f.buildings).then((j) => j.buildings))),
      get(() => (f.pois ? loadJSON(f.pois) : null)),
      get(() => (f.buildingsMeta ? loadJSON(f.buildingsMeta) : null)),
      get(() => (f.buildingsMetaBin ? loadBin(f.buildingsMetaBin, Uint8Array) : null)),
      get(() => (f.terrain ? loadJSON(f.terrain) : null)),
    ]);
    if (!data) data = await loadJSON('/shared/world/paris.sample.json');
    data.buildings = buildings; data.pois = pois; data.buildingsMeta = bmeta; data.buildingsMetaBin = bmetaBin; data.terrain = terrain;
    if (terrain) setHeightmap(terrain);
    // agl=1 : les hauteurs de cam et look sont comptées au-dessus du relief (vues piéton / conducteur à Toulouse)
    if (params.get('agl')) { cp[1] += baseHeightAt(cp[0], cp[2]); lk[1] += baseHeightAt(lk[0], lk[2]); camera.position.set(...cp); camera.lookAt(...lk); }
    window.__loadMs = Math.round(performance.now() - tLoad);
    // essai des niveaux superposés sans données : un pont routier et une trémie fabriqués sur deux voies proches de l'origine
    if (params.get('fakeele')) {
      const pick = data.roads.filter((r) => r.kind !== 'pedestrian' && !r.bridge && r.points.length >= 2).map((r) => { let L = 0; for (let i = 1; i < r.points.length; i++) L += Math.hypot(r.points[i][0] - r.points[i - 1][0], r.points[i][1] - r.points[i - 1][1]); return [r, L, Math.hypot(r.points[0][0], r.points[0][1])]; }).filter((e) => e[1] > 260 && e[2] < 1500).sort((a, b) => a[2] - b[2]);
      const shape = (r, top, tunnel) => { // rééchantillonne la voie tous les 10 m et pose un profil rampe - palier - rampe
        const pts = [], cum = [0]; for (let i = 1; i < r.points.length; i++) cum.push(cum[i - 1] + Math.hypot(r.points[i][0] - r.points[i - 1][0], r.points[i][1] - r.points[i - 1][1]));
        const L = cum[cum.length - 1], n = Math.ceil(L / 10), ele = [];
        for (let i = 0, k = 0; i <= n; i++) { const s = (L * i) / n; while (k < cum.length - 2 && cum[k + 1] < s) k++; const t = (s - cum[k]) / (cum[k + 1] - cum[k] || 1); pts.push([r.points[k][0] + (r.points[k + 1][0] - r.points[k][0]) * t, r.points[k][1] + (r.points[k + 1][1] - r.points[k][1]) * t]);
          const ramp = Math.abs(top) / 0.08, a = 20, b = L - 20; ele.push(+(top * Math.max(0, Math.min(1, (s - a) / ramp, (b - s) / ramp))).toFixed(2)); }
        r.points = pts; r.ele = ele; if (tunnel) r.tunnel = true;
      };
      if (pick[0]) shape(pick[0][0], 6.5, false);
      if (pick[1]) shape(pick[1][0], -6, true);
      window.__fake = pick.slice(0, 2).map((e) => ({ name: e[0].name, mid: e[0].points[e[0].points.length >> 1], a: e[0].points[0], b: e[0].points[e[0].points.length - 1], ele: e[0].ele }));
    }
    if (params.get('fakepois')) { // jeu d'essai pour le chemin « données v3 » (arbres réels, stations de métro)
      const trees = []; for (let i = 0; i < 1200; i++) trees.push(843 + (Math.random() - 0.5) * 500, -455 + (Math.random() - 0.5) * 500);
      data.pois = { trees, treeRows: [{ points: [[820, -520], [850, -420]] }], pois: [1, 2, 3, 4, 5, 6].map((k) => ({ kind: 'metro', name: 'Station ' + k, x: 843 + k * 40, z: -455 + k * 25 })) };
    }
    const ctx = { THREE, renderer, scene, camera, canvas, bus, collision, params, store: { timeOfDay: hour }, heightAt, baseHeightAt, WATER_LEVEL, LANDMARKS, LANDMARK_BY_ID, BOUNDS, city: CITY, cities: CITIES, primeAt: { x: camera.position.x, z: camera.position.z },
      quality: params.get('quality') || 'high', worldData: data, time: 0, fps: 60, env: { sun } };
    window.__game = ctx;
    const tBuild = performance.now();
    ctx.world = await createWorld(ctx);
    window.__buildMs = performance.now() - tBuild;
    bus.emit('env:time', { hour, night });

    // caméra libre
    const keys = new Set(); let yaw = 0, pitch = 0, drag = false;
    { const d = new THREE.Vector3(); camera.getWorldDirection(d); yaw = Math.atan2(-d.x, -d.z); pitch = Math.asin(d.y); }
    addEventListener('keydown', (e) => keys.add(e.code)); addEventListener('keyup', (e) => keys.delete(e.code));
    canvas.addEventListener('mousedown', () => (drag = true)); addEventListener('mouseup', () => (drag = false));
    addEventListener('mousemove', (e) => { if (drag) { yaw -= e.movementX * 0.004; pitch = Math.max(-1.5, Math.min(1.5, pitch - e.movementY * 0.004)); } });
    addEventListener('wheel', (e) => { const d = new THREE.Vector3(); camera.getWorldDirection(d); camera.position.addScaledVector(d, -e.deltaY * 0.2); });
    addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
    window.__setCam = (x, y, z, tx, ty, tz) => { camera.position.set(x, y, z); camera.lookAt(tx, ty, tz); const d = new THREE.Vector3(); camera.getWorldDirection(d); yaw = Math.atan2(-d.x, -d.z); pitch = Math.asin(d.y); };

    // mesure du coût réel d'une image (ms) : n rendus puis synchronisation GPU
    window.__bench = (n = 40) => { const gl = renderer.getContext(), px = new Uint8Array(4); renderer.render(scene, camera); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
      const t = performance.now(); for (let i = 0; i < n; i++) { ctx.world.update(0.016); renderer.render(scene, camera); } gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); return +((performance.now() - t) / n).toFixed(2); };
    const sp = num(params.get('sun'), [37, 53]); // azimut (0 = nord, 90 = est), élévation en degrés
    const SUN = [Math.sin(sp[0] * Math.PI / 180) * Math.cos(sp[1] * Math.PI / 180) * 650, Math.sin(sp[1] * Math.PI / 180) * 650, -Math.cos(sp[0] * Math.PI / 180) * Math.cos(sp[1] * Math.PI / 180) * 650];
    // Contrôle automatique des surfaces de sol superposées : rayons verticaux sur une grille de points (chaussées,
    // carrefours, trottoirs, places, quais, ponts). Défaut = deux surfaces VISIBLES d'aspect différent (couche, mode ou
    // teinte) à moins de 3 mm l'une de l'autre. Les recouvrements de même matière (deux rubans d'asphalte identiques)
    // sont comptés à part : ils produisent le même pixel quel que soit le gagnant.
    window.__groundCheck = (nRoad = 1500, nNode = 1200, nPlace = 250) => {
      const sols = []; scene.traverse((m) => { if (m.name === 'sol') sols.push(m); });
      const rc = new THREE.Raycaster(); const O = new THREE.Vector3(), D = new THREE.Vector3(0, -1, 0);
      const w = ctx.world, pts = [];
      let seed = 12345; const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
      const roads = data.roads.filter((r) => r.points.length >= 2);
      for (let i = 0; i < nRoad; i++) { const r = roads[(rnd() * roads.length) | 0], k = (rnd() * (r.points.length - 1)) | 0, t = rnd(); const a = r.points[k], b = r.points[k + 1];
        const x = a[0] + (b[0] - a[0]) * t, z = a[1] + (b[1] - a[1]) * t, L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, nx = (b[1] - a[1]) / L, nz = -(b[0] - a[0]) / L, hw = r.width / 2;
        for (const o of [0, hw * 0.6, -hw * 0.6, hw + 0.12, -(hw + 0.12), hw + 1.2, -(hw + 1.2)]) pts.push([x + nx * o, z + nz * o, r.bridge ? 'pont' : 'voie']); }
      const nodes = data.graph?.nodes || [];
      for (let i = 0; i < nNode && nodes.length; i++) { const n = nodes[(rnd() * nodes.length) | 0]; for (const [dx, dz] of [[0, 0], [2.5, 0], [-2.5, 0], [0, 2.5], [0, -2.5], [4, 4], [-4, 4]]) pts.push([n[0] + dx, n[1] + dz, 'carrefour']); }
      const places = [['arc', 125], ['concorde', 130], ['louvre', 150], ['opera', 90], ['madeleine', 80], ['trocadero', 110], ['notredame', 110], ['invalides', 140], ['eiffel', 120]];
      for (const [id, R] of places) { const l = LANDMARK_BY_ID[id]; if (!l) continue; for (let i = 0; i < nPlace; i++) { const a = rnd() * 6.283, r = Math.sqrt(rnd()) * R; pts.push([l.x + Math.cos(a) * r, l.z + Math.sin(a) * r, 'place:' + id]); } }
      for (const pl of (data.plazas || []).concat(data.parks || [])) { if (!/Vendôme|Victoires|Dauphine|Tertre|Carrousel|Tuileries|Luxembourg/.test(pl.name || '')) continue; const p = pl.polygon; for (let i = 0; i < 60; i++) { const a = p[(rnd() * p.length) | 0], b = p[(rnd() * p.length) | 0], t = rnd(); pts.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, 'place:' + pl.name]); } }
      // berges basses et rampes : points pris là où la couche de hauteur est définie
      const bh = w._river?.bergeHeight; if (bh) { let nb = 0; for (let i = 0; i < 400000 && nb < 2500; i++) { const x = BOUNDS.minX + rnd() * (BOUNDS.maxX - BOUNDS.minX), z = -300 + rnd() * 2800; const h = bh(x, z); if (h !== undefined) { pts.push([x, z, h === -3 ? 'berge' : 'rampe']); nb++; } } }
      let defects = 0, benign = 0, multi = 0; const byKind = {}, examples = [];
      for (const [x, z, kind] of pts) {
        O.set(x, 60, z); rc.set(O, D); rc.far = 80;
        const hits = [];
        for (const m of sols) { const s = m.geometry.boundingSphere; if (Math.hypot(s.center.x - x, s.center.z - z) > s.radius) continue;
          for (const h of rc.intersectObject(m, false)) { const g = m.geometry, i = h.face.a, su = g.attributes.aSurf, co = g.attributes.color; const layer = su.getX(i);
            if (layer === 8 && w.isWater && w._maskWater?.(x, z)) continue; // sol découpé par le masque de la Seine
            hits.push({ y: h.point.y, sig: layer + '/' + su.getZ(i) + '/' + co.getX(i).toFixed(2) + co.getY(i).toFixed(2), layer }); } }
        hits.sort((a, b) => b.y - a.y);
        let bad = false, same = false;
        for (let i = 0; i + 1 < hits.length; i++) if (hits[i].y - hits[i + 1].y < 0.003) { if (hits[i].sig !== hits[i + 1].sig) bad = true; else same = true; }
        if (hits.length > 1) multi++;
        if (bad) { defects++; byKind[kind] = (byKind[kind] || 0) + 1; if (examples.length < 6) examples.push([Math.round(x), Math.round(z), kind, hits.slice(0, 4).map((h) => h.y.toFixed(4) + ':' + h.sig).join(' | ')]); }
        else if (same) benign++;
      }
      return { points: pts.length, defects, sameMaterialOverlaps: benign, multiSurface: multi, byKind, examples };
    };
    const hud = document.getElementById('hud');
    let last = performance.now(), acc = 0, frames = 0;
    renderer.setAnimationLoop((now) => {
      const dt = Math.min((now - last) / 1000, 0.05); last = now; ctx.time += dt; acc += dt; frames++;
      const sp = (keys.has('ShiftLeft') ? 200 : 40) * dt;
      const f = (keys.has('KeyW') || keys.has('KeyZ') ? 1 : 0) - (keys.has('KeyS') ? 1 : 0), s = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') || keys.has('KeyQ') ? 1 : 0);
      camera.rotation.set(pitch, yaw, 0, 'YXZ');
      camera.position.x += (-Math.sin(yaw) * f + Math.cos(yaw) * s) * sp; camera.position.z += (-Math.cos(yaw) * f - Math.sin(yaw) * s) * sp;
      camera.position.y += ((keys.has('KeyE') ? 1 : 0) - (keys.has('KeyC') ? 1 : 0)) * sp;
      // le soleil suit la caméra (ombres)
      sun.target.position.set(camera.position.x, 0, camera.position.z); sun.position.set(camera.position.x + SUN[0], SUN[1], camera.position.z + SUN[2]);
      ctx.world.update(dt);
      if (!window.__readyMs && ctx.world.stats.pending === 0) window.__readyMs = Math.round(performance.now() - tBuild); // premier affichage complet autour du point de départ
      renderer.render(scene, camera);
      if (acc >= 0.5) {
        ctx.fps = frames / acc; acc = 0; frames = 0;
        window.__stats = { fps: Math.round(ctx.fps), calls: renderer.info.render.calls, tris: renderer.info.render.triangles, geometries: renderer.info.memory.geometries, textures: renderer.info.memory.textures, pending: ctx.world.stats.pending, buildMs: Math.round(window.__buildMs) };
        hud.textContent = `fps ${window.__stats.fps}  draw calls ${window.__stats.calls}  tris ${(window.__stats.tris / 1e6).toFixed(2)} M  build ${window.__stats.buildMs} ms\n` + JSON.stringify(ctx.world.stats.timings) + '\n' + JSON.stringify(ctx.world.stats.tiles) + ' en attente ' + ctx.world.stats.pending;
      }
    });
  </script>
</body>
</html>
