<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" /><link rel="icon" href="data:,">
  <title>Mission Zéro — test environnement / audio</title>
  <style>html,body{margin:0;height:100%;overflow:hidden;background:#0b0e14;font-family:system-ui,sans-serif}#game{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hud{position:fixed;left:8px;top:8px;color:#fff;font:12px/1.4 monospace;background:#0008;padding:6px 8px;border-radius:6px;white-space:pre}</style>
  <script type="importmap">
  { "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/", "@shared/": "/shared/" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <script type="module">
  // Scène de test isolée : sol, immeubles-boîtes, sphères métal/peinture auto, émissifs, tour lointaine (5 km).
  // Paramètres : time, weather, quality, cam=x,y,z, look=x,y,z, drive=1 (faux véhicule pour l'audio), electric=1, type=<typeId>
  // Touches : T/G heure ±1, 1/2/3 météo, Q qualité suivante, W accélérer (faux véhicule), Espace frein à main.
  import * as THREE from 'three';
  import { bus } from '/src/core/bus.js';
  import { store } from '/src/core/store.js';
  import { createEnvironment } from '/src/env/index.js';
  import { createAudio } from '/src/audio/index.js';

  const params = new URLSearchParams(location.search);
  const canvas = document.getElementById('game');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.3, 9000);
  const v3 = (s, d) => new THREE.Vector3(...(s ? s.split(',').map(Number) : d));
  camera.position.copy(v3(params.get('cam'), [5.5, 3.2, 27]));
  const look = v3(params.get('look'), [-1.5, 2.2, 0]);
  camera.lookAt(look);

  const ctx = { THREE, renderer, scene, camera, canvas, bus, store, params, quality: params.get('quality') || 'high', time: 0, fps: 60,
    heightAt: () => 0, worldData: { parks: [] }, vehicles: { list: [] }, player: { pos: { x: 0, y: 0, z: 0 }, yaw: 0, speed: 0, mode: 'foot', vehicle: null } };
  window.__game = ctx;

  // --- décor ---
  const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(12000, 12000), new THREE.MeshStandardMaterial({ color: 0x7d7f80, roughness: 0.9 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const road = new THREE.Mesh(new THREE.PlaneGeometry(14, 600), new THREE.MeshStandardMaterial({ color: 0x4a4c50, roughness: 0.75 }));
  road.rotation.x = -Math.PI / 2; road.position.y = 0.02; road.receiveShadow = true; scene.add(road);
  const stone = new THREE.MeshStandardMaterial({ color: 0xd9cfb8, roughness: 0.85 });
  const roof = new THREE.MeshStandardMaterial({ color: 0x5f6a75, roughness: 0.5, metalness: 0.3 });
  const winOn = new THREE.MeshStandardMaterial({ color: 0x221a10, emissive: 0xffc47a, emissiveIntensity: 1.6, roughness: 0.3 });
  const winOff = new THREE.MeshPhysicalMaterial({ color: 0x1a2530, roughness: 0.08, metalness: 0.0, reflectivity: 1 });
  for (let side = -1; side <= 1; side += 2) for (let i = 0; i < 14; i++) {
    const w = 18 + rnd() * 10, h = 18 + rnd() * 8, d = 14;
    const z = 60 - i * 26, x = side * (7 + 4 + d / 2);
    const b = new THREE.Mesh(new THREE.BoxGeometry(d, h, w - 1), stone); b.position.set(x, h / 2, z); b.castShadow = b.receiveShadow = true; scene.add(b);
    const r = new THREE.Mesh(new THREE.BoxGeometry(d - 1.5, 3, w - 2.5), roof); r.position.set(x, h + 1.5, z); r.castShadow = true; scene.add(r);
    for (let fy = 0; fy < Math.floor(h / 3.4) - 1; fy++) for (let fz = 0; fz < 5; fz++) {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 2.1), rnd() < 0.35 ? winOn : winOff);
      m.position.set(x - side * (d / 2 + 0.03), 4.5 + fy * 3.4, z - w / 2 + 2.5 + fz * ((w - 5) / 4)); m.rotation.y = -side * Math.PI / 2; scene.add(m);
    }
  }
  // lampadaires émissifs
  const lampMat = new THREE.MeshStandardMaterial({ color: 0xfff1d0, emissive: 0xffd9a0, emissiveIntensity: 4 });
  const poleMat = new THREE.MeshStandardMaterial({ color: 0x1c2420, roughness: 0.6, metalness: 0.6 });
  for (let i = 0; i < 12; i++) for (const s of [-1, 1]) {
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.1, 6, 8), poleMat); p.position.set(s * 8.2, 3, 50 - i * 28); p.castShadow = true; scene.add(p);
    const l = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 8), lampMat); l.position.set(s * 8.2, 6.1, 50 - i * 28); scene.add(l);
  }
  // sphères : chrome, peinture auto rouge/bleu nuit/blanc nacré, plastique mat ; verre
  const mats = [
    new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: 0.05 }),
    new THREE.MeshPhysicalMaterial({ color: 0xb00818, metalness: 0.6, roughness: 0.35, clearcoat: 1, clearcoatRoughness: 0.04 }),
    new THREE.MeshPhysicalMaterial({ color: 0x0a1a40, metalness: 0.7, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.03 }),
    new THREE.MeshPhysicalMaterial({ color: 0xf2f0ea, metalness: 0.2, roughness: 0.4, clearcoat: 1, clearcoatRoughness: 0.05 }),
    new THREE.MeshStandardMaterial({ color: 0x33373c, metalness: 0, roughness: 0.9 }),
  ];
  mats.forEach((m, i) => { const s = new THREE.Mesh(new THREE.SphereGeometry(1.1, 48, 32), m); s.position.set(-5 + i * 2.6, 1.1, 8); s.castShadow = s.receiveShadow = true; scene.add(s); });
  const glass = new THREE.Mesh(new THREE.BoxGeometry(4, 2.4, 0.06), new THREE.MeshPhysicalMaterial({ color: 0x9fc0d0, transparent: true, opacity: 0.35, roughness: 0.03, metalness: 0 }));
  glass.position.set(4.5, 1.3, 13); scene.add(glass);
  // voiture-boîte avec phares et feux
  const car = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.9, 4.4), mats[2]); body.position.y = 0.75; body.castShadow = true; car.add(body);
  const cab = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.6, 2.2), winOff); cab.position.set(0, 1.45, 0.2); cab.castShadow = true; car.add(cab);
  const hl = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff4e0, emissiveIntensity: 6 });
  const tl = new THREE.MeshStandardMaterial({ color: 0x400000, emissive: 0xff1508, emissiveIntensity: 3 });
  for (const s of [-1, 1]) {
    const a = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.16, 0.05), hl); a.position.set(s * 0.65, 0.85, -2.22); car.add(a);
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.14, 0.05), tl); b.position.set(s * 0.65, 0.9, 2.22); car.add(b);
  }
  car.position.set(-3, 0, 16); car.rotation.y = 0.5; scene.add(car);
  // tour lointaine (≈ Tour Eiffel à 5 km) + skyline
  const tower = new THREE.Mesh(new THREE.CylinderGeometry(4, 60, 330, 4), new THREE.MeshStandardMaterial({ color: 0x6b5a48, roughness: 0.6, metalness: 0.4 }));
  tower.position.set(-600, 165, -5000); scene.add(tower);
  for (let i = 0; i < 60; i++) { const h = 20 + rnd() * 40; const b = new THREE.Mesh(new THREE.BoxGeometry(40, h, 40), stone); b.position.set(-1500 + rnd() * 3000, h / 2, -600 - rnd() * 3500); scene.add(b); }

  // --- modules ---
  ctx.env = createEnvironment(ctx);
  // faux véhicule pour tester le moteur audio
  const fake = { id: 'fake', typeId: params.get('type') || 'clio', spec: { maxSpeed: 55, electric: !!params.get('electric') }, pos: { x: 0, y: 0, z: 0 }, yaw: 0, speed: 0, controls: { throttle: 0, brake: 0, steer: 0, handbrake: false }, group: car };
  ctx.audio = await createAudio(ctx) || {};
  if (!params.get('menu')) bus.emit('net:welcome', { offline: true }); // ?menu=1 : laisse jouer la musique de menu
  const held = new Set();
  addEventListener('keydown', (e) => {
    held.add(e.code);
    if (e.code === 'KeyT') ctx.env.setTimeOfDay(ctx.env.hour + 1);
    if (e.code === 'KeyG') ctx.env.setTimeOfDay(ctx.env.hour - 1);
    if (e.code === 'Digit1') ctx.env.setWeather('clear');
    if (e.code === 'Digit2') ctx.env.setWeather('overcast');
    if (e.code === 'Digit3') ctx.env.setWeather('rain');
    if (e.code === 'KeyQ') ctx.env.setQuality({ low: 'medium', medium: 'high', high: 'low' }[ctx.quality]);
    if (e.code === 'KeyF') { if (ctx.player.mode === 'foot') { ctx.player.mode = 'vehicle'; ctx.player.vehicle = fake; bus.emit('player:enterVehicle', { vehicle: fake }); } else { ctx.player.mode = 'foot'; ctx.player.vehicle = null; bus.emit('player:exitVehicle', { vehicle: fake }); } }
    if (e.code === 'KeyH') bus.emit('traffic:honk', { x: 10, z: 0 });
    if (e.code === 'KeyC') bus.emit('vehicle:crash', { vehicle: fake, impact: 8 });
    if (e.code === 'KeyM') bus.emit('money:change', { delta: 500, balance: 1000 });
  });
  addEventListener('keyup', (e) => held.delete(e.code));
  if (params.get('drive')) { ctx.player.mode = 'vehicle'; ctx.player.vehicle = fake; setTimeout(() => bus.emit('player:enterVehicle', { vehicle: fake }), 300); }
  addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); bus.emit('resize', { w: innerWidth, h: innerHeight }); });

  const hud = document.getElementById('hud');
  if (params.get('hud') === '0') hud.style.display = 'none';
  let last = performance.now(), acc = 0, frames = 0;
  renderer.setAnimationLoop((now) => {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    ctx.time += dt; acc += dt; frames++;
    if (acc >= 0.5) { ctx.fps = frames / acc; acc = 0; frames = 0;
      const i = renderer.info.render;
      hud.textContent = `fps ${ctx.fps.toFixed(0)}  ${ctx.quality}  pr ${ctx.env.pixelRatio.toFixed(2)} niv ${ctx.env.dynLevel}\nheure ${ctx.env.hour.toFixed(2)}  soleil ${ctx.env.sunElevation.toFixed(1)}°  ${ctx.env.isNight() ? 'nuit' : 'jour'}\nmétéo ${ctx.env.weather} pluie ${ctx.env.rain.toFixed(2)} mouillé ${ctx.env.wetness.toFixed(2)}\nv ${(fake.speed * 3.6).toFixed(0)} km/h`; }
    // faux véhicule
    fake.controls.throttle = held.has('KeyW') ? 1 : 0; fake.controls.handbrake = held.has('Space');
    fake.speed += (fake.controls.throttle * 9 - 0.02 * fake.speed * Math.abs(fake.speed) * 0.1 - (fake.controls.handbrake ? 14 : 1.2)) * dt; fake.speed = Math.max(0, Math.min(fake.spec.maxSpeed, fake.speed));
    ctx.env.update(dt); ctx.audio.update?.(dt);
    ctx.env.render(dt);
  });
  </script>
</body>
</html>
